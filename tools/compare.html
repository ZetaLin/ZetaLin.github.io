<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>智能文本差异对比工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f7fb;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    .app {
      max-width: 1500px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      padding: 1.8rem 1.8rem 2rem;
      position: relative;
    }

    .home-link {
      position: absolute;
      top: 1.8rem;
      right: 2rem;
      background: #f1f5f9;
      color: #1e293b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.3rem 1rem 0.3rem 0.9rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #e2e8f0;
      transition: 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .home-link:hover {
      background: #e9edf4;
      border-color: #cbd5e1;
      transform: scale(1.02);
    }

    .home-link svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #1e293b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e9edf4;
    }

    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #64748b;
      margin-left: 0.6rem;
      background: #f1f4f9;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .right-tools {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn {
      background: white;
      border: 1px solid #d0d8e5;
      color: #1e293b;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary { background: #1e293b; border-color: #1e293b; color: white; }
    .btn-primary:hover { background: #0f172a; border-color: #0f172a; }
    .btn-outline:hover { background: #f1f5f9; border-color: #b0c0d4; }
    .btn.active { background: #e2e8f0; border-color: #94a3b8; }
    .btn:active { transform: scale(0.96); }

    .info-badge {
      font-size: 0.8rem;
      background: #f1f5f9;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: #334155;
      border: 1px solid #e2e8f0;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    .col {
      background: #ffffff;
      border-radius: 1.2rem;
      border: 1px solid #eef2f8;
      display: flex;
      flex-direction: column;
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      padding: 0.7rem 1.2rem;
      background: #fafcff;
      border-bottom: 1px solid #eef2f8;
      border-radius: 1.2rem 1.2rem 0 0;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .col-header .count {
      background: #e9edf4;
      padding: 0.1rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      color: #475569;
    }

    .text-area-wrap {
      padding: 0.8rem;
      height: 500px;
      position: relative;
    }

    .line-numbered-area {
      display: flex;
      width: 100%;
      height: 100%;
      background: #fcfdff;
      border-radius: 0.6rem;
      border: 1px solid #eef2f8;
      overflow: hidden;
    }

    .line-numbers {
      background: #fafcff;
      color: #94a3b8;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 24px;
      padding: 12px 6px 12px 12px;
      text-align: right;
      user-select: none;
      min-width: 3.2rem;
      border-right: 1px solid #e9edf4;
      overflow: hidden; 
    }

    .line-numbers span {
      display: block;
      height: 24px;
    }

    .text-area-wrapper {
      flex: 1;
      position: relative;
      background: transparent;
      overflow: hidden;
    }

    .text-area, .text-backdrop, .highlight-layer {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 24px;
      padding: 12px;
      white-space: pre;
      tab-size: 4;
      margin: 0;
    }

    .text-area {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none; 
      background: transparent;
      color: transparent; 
      caret-color: #1e293b;
      overflow: auto;
      position: relative;
      z-index: 3;
    }

    .text-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      min-width: max-content;
      color: #0b1a2b;
      pointer-events: none;
      z-index: 2;
    }

    .text-backdrop div {
      height: 24px; 
    }

    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      min-width: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .diff-line-marker {
      position: absolute;
      left: 12px;
      right: 12px;
      background: rgba(255, 215, 0, 0.25);
      border-left: 4px solid #e6a100;
      border-radius: 0 6px 6px 0;
      height: 24px;
    }

    .inline-diff-char {
      background-color: rgba(230, 81, 0, 0.35);
      color: #b71c1c;
      border-bottom: 2px solid #d84315;
      border-radius: 2px;
      /* 重点修复：去掉了 font-weight: 600，防止字符变宽导致顶层和底层的光标/文本错位 */
    }

    .text-area::-webkit-scrollbar { width: 8px; height: 8px; }
    .text-area::-webkit-scrollbar-track { background: #f1f4f9; }
    .text-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .text-area::-webkit-scrollbar-thumb:hover { background: #a0aec0; }
  </style>
</head>
<body>
<div class="app">
  <a href="https://zetalin.top/" class="home-link" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    回到主页
  </a>

  <h1>📄 智能文本差异对比工具<small>语义对齐 · 空行感知</small></h1>

  <div class="toolbar">
    <div class="actions">
      <button class="btn btn-primary" id="compareBtn">🔍 智能对比</button>
      <button class="btn btn-outline" id="syncScrollBtn">🔄 同步滚动：开启</button>
      <button class="btn btn-outline" id="clearBtn">🗑️ 清空</button>
    </div>
    
    <div class="right-tools">
      <div class="info-badge">
        <span>⚡ 不同行 </span>
        <span id="diffCount" style="font-weight:600;">0</span>
      </div>
      <button class="btn btn-outline" id="scrollTopBtn" title="滚动到顶部">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        顶部
      </button>
      <button class="btn btn-outline" id="scrollBottomBtn" title="滚动到底部">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        底部
      </button>
    </div>
  </div>

  <div class="compare-grid">
    <div class="col">
      <div class="col-header">
        <span>📝 基础文本</span>
        <span class="count" id="leftCount">0 行</span>
      </div>
      <div class="text-area-wrap">
        <div class="line-numbered-area">
          <div class="line-numbers" id="leftLineNumbers"></div>
          <div class="text-area-wrapper">
            <div class="highlight-layer" id="leftHighlightLayer"></div>
            <div class="text-backdrop" id="leftBackdrop"></div>
            <textarea class="text-area" id="leftText" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="col-header">
        <span>📝 对比文本</span>
        <span class="count" id="rightCount">0 行</span>
      </div>
      <div class="text-area-wrap">
        <div class="line-numbered-area">
          <div class="line-numbers" id="rightLineNumbers"></div>
          <div class="text-area-wrapper">
            <div class="highlight-layer" id="rightHighlightLayer"></div>
            <div class="text-backdrop" id="rightBackdrop"></div>
            <textarea class="text-area" id="rightText" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const leftText = document.getElementById('leftText');
    const rightText = document.getElementById('rightText');
    const leftLineNumbers = document.getElementById('leftLineNumbers');
    const rightLineNumbers = document.getElementById('rightLineNumbers');
    const leftHighlightLayer = document.getElementById('leftHighlightLayer');
    const rightHighlightLayer = document.getElementById('rightHighlightLayer');
    const leftBackdrop = document.getElementById('leftBackdrop');
    const rightBackdrop = document.getElementById('rightBackdrop');
    
    const diffCountSpan = document.getElementById('diffCount');
    const leftCountSpan = document.getElementById('leftCount');
    const rightCountSpan = document.getElementById('rightCount');

    const LINE_HEIGHT = 24;
    const PADDING_TOP = 12;
    const showInlineDiff = true; 

    let isCrossSyncScroll = true;
    let isSyncingLeft = false;
    let isSyncingRight = false;
    
    const syncScrollBtn = document.getElementById('syncScrollBtn');
    syncScrollBtn.addEventListener('click', function() {
      isCrossSyncScroll = !isCrossSyncScroll;
      this.textContent = isCrossSyncScroll ? '🔄 同步滚动：开启' : '⏸️ 同步滚动：关闭';
      this.classList.toggle('active', !isCrossSyncScroll);
    });

    document.getElementById('scrollTopBtn').addEventListener('click', function() {
      leftText.scrollTo({ top: 0, behavior: 'smooth' });
      rightText.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('scrollBottomBtn').addEventListener('click', function() {
      leftText.scrollTo({ top: leftText.scrollHeight, behavior: 'smooth' });
      rightText.scrollTo({ top: rightText.scrollHeight, behavior: 'smooth' });
    });

    function syncInnerScroll(textarea, lineNumbers, backdrop, highlight) {
      lineNumbers.scrollTop = textarea.scrollTop;
      backdrop.style.transform = `translate(-${textarea.scrollLeft}px, -${textarea.scrollTop}px)`;
      highlight.style.transform = `translate(-${textarea.scrollLeft}px, -${textarea.scrollTop}px)`;
    }

    leftText.addEventListener('scroll', function() {
      syncInnerScroll(leftText, leftLineNumbers, leftBackdrop, leftHighlightLayer);
      if (isCrossSyncScroll) {
        if (!isSyncingLeft) {
          isSyncingRight = true;
          rightText.scrollTop = this.scrollTop;
          rightText.scrollLeft = this.scrollLeft;
        }
        isSyncingLeft = false;
      }
    });

    rightText.addEventListener('scroll', function() {
      syncInnerScroll(rightText, rightLineNumbers, rightBackdrop, rightHighlightLayer);
      if (isCrossSyncScroll) {
        if (!isSyncingRight) {
          isSyncingLeft = true;
          leftText.scrollTop = this.scrollTop;
          leftText.scrollLeft = this.scrollLeft;
        }
        isSyncingRight = false;
      }
    });

    // 重点修复：通过翻转字符串进行 DP 对比，使得差异标记推迟到重复字符的末尾
    function getInlineDiffs(s1, s2) {
      const r1 = s1.split('').reverse().join('');
      const r2 = s2.split('').reverse().join('');
      const len1 = r1.length, len2 = r2.length;
      const dp = Array(len1 + 1).fill(0).map(() => Array(len2 + 1).fill(0));
      
      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          if (r1[i - 1] === r2[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
          else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      
      let i = len1, j = len2;
      const diffIndices1 = new Set(), diffIndices2 = new Set();
      
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && r1[i - 1] === r2[j - 1]) { 
          i--; j--; 
        }
        else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) { 
          j--;
          diffIndices2.add(len2 - 1 - j); // 转换回原字符串正确的索引
        }
        else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) { 
          i--;
          diffIndices1.add(len1 - 1 - i); // 转换回原字符串正确的索引
        }
      }
      return { diffIndices1, diffIndices2 };
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateBackdrop(textarea, backdropDiv, lineDiffsMap) {
      const lines = textarea.value.split('\n');
      let html = '';
      for (let i = 0; i < lines.length; i++) {
        const lineStr = lines[i];
        const diffIndices = lineDiffsMap.get(i);
        if (showInlineDiff && diffIndices && diffIndices.size > 0 && lineStr) {
          let lineHtml = '';
          for (let c = 0; c < lineStr.length; c++) {
            const safeChar = escapeHtml(lineStr[c]);
            lineHtml += diffIndices.has(c) ? `<span class="inline-diff-char">${safeChar}</span>` : safeChar;
          }
          html += `<div>${lineHtml}</div>`;
        } else {
          html += `<div>${escapeHtml(lineStr) || ' '}</div>`;
        }
      }
      backdropDiv.innerHTML = html;
    }

    function addHighlight(layer, lineIndex) {
      const marker = document.createElement('div');
      marker.className = 'diff-line-marker';
      marker.style.top = `${lineIndex * LINE_HEIGHT + PADDING_TOP}px`;
      layer.appendChild(marker);
    }

    function updateLineNumbers(textarea, lineNumbersDiv) {
      const count = Math.max(1, textarea.value.split('\n').length);
      lineNumbersDiv.innerHTML = Array.from({length: count}, (_, i) => `<span>${i + 1}</span>`).join('');
    }

    function performDiff() {
      const leftFullLines = leftText.value.split('\n');
      const rightFullLines = rightText.value.split('\n');

      leftHighlightLayer.innerHTML = '';
      rightHighlightLayer.innerHTML = '';
      leftCountSpan.textContent = `${leftFullLines.length} 行`;
      rightCountSpan.textContent = `${rightFullLines.length} 行`;
      
      updateLineNumbers(leftText, leftLineNumbers);
      updateLineNumbers(rightText, rightLineNumbers);

      const extractContent = lines => lines.map((line, index) => ({ line, index })).filter(item => item.line.trim() !== '');
      const leftContent = extractContent(leftFullLines);
      const rightContent = extractContent(rightFullLines);

      let diffCount = 0;
      const minLen = Math.min(leftContent.length, rightContent.length);
      const leftLineDiffsMap = new Map(), rightLineDiffsMap = new Map();

      for (let i = 0; i < minLen; i++) {
        if (leftContent[i].line !== rightContent[i].line) {
          diffCount++;
          if (showInlineDiff) {
            const res = getInlineDiffs(leftContent[i].line, rightContent[i].line);
            leftLineDiffsMap.set(leftContent[i].index, res.diffIndices1);
            rightLineDiffsMap.set(rightContent[i].index, res.diffIndices2);
          }
          addHighlight(leftHighlightLayer, leftContent[i].index);
          addHighlight(rightHighlightLayer, rightContent[i].index);
        }
      }

      for (let i = minLen; i < leftContent.length; i++) {
        diffCount++; addHighlight(leftHighlightLayer, leftContent[i].index);
      }
      for (let i = minLen; i < rightContent.length; i++) {
        diffCount++; addHighlight(rightHighlightLayer, rightContent[i].index);
      }

      const getBlankLineIndices = (lines, contentItems, fromIdx, toIdx) => {
        const indices = [];
        for (let i = contentItems[fromIdx].index + 1; i < contentItems[toIdx].index; i++) {
          if (lines[i].trim() === '') indices.push(i);
        }
        return indices;
      };

      const maxPairs = Math.max(leftContent.length - 1, rightContent.length - 1);
      for (let p = 0; p < maxPairs; p++) {
        const leftBlankIndices = (p < leftContent.length - 1) ? getBlankLineIndices(leftFullLines, leftContent, p, p + 1) : [];
        const rightBlankIndices = (p < rightContent.length - 1) ? getBlankLineIndices(rightFullLines, rightContent, p, p + 1) : [];
        
        if (leftBlankIndices.length !== rightBlankIndices.length) {
          leftBlankIndices.forEach(idx => { diffCount++; addHighlight(leftHighlightLayer, idx); });
          rightBlankIndices.forEach(idx => { diffCount++; addHighlight(rightHighlightLayer, idx); });
        }
      }

      const checkEdgeBlanks = (leftLines, rightLines, isTrailing) => {
        const leftBlanks = [], rightBlanks = [];
        const iter = isTrailing 
          ? { start: leftLines.length - 1, step: -1, condition: i => i >= 0 }
          : { start: 0, step: 1, condition: i => i < leftLines.length };

        for (let i = iter.start; iter.condition(i); i += iter.step) {
          if (leftLines[i].trim() === '') leftBlanks.push(i); else break;
        }
        
        const rIter = isTrailing 
          ? { start: rightLines.length - 1, step: -1, condition: i => i >= 0 }
          : { start: 0, step: 1, condition: i => i < rightLines.length };
          
        for (let i = rIter.start; rIter.condition(i); i += rIter.step) {
          if (rightLines[i].trim() === '') rightBlanks.push(i); else break;
        }

        if (leftBlanks.length !== rightBlanks.length) {
          leftBlanks.forEach(idx => { diffCount++; addHighlight(leftHighlightLayer, idx); });
          rightBlanks.forEach(idx => { diffCount++; addHighlight(rightHighlightLayer, idx); });
        }
      };

      checkEdgeBlanks(leftFullLines, rightFullLines, false);
      checkEdgeBlanks(leftFullLines, rightFullLines, true);

      diffCountSpan.textContent = diffCount;
      updateBackdrop(leftText, leftBackdrop, leftLineDiffsMap);
      updateBackdrop(rightText, rightBackdrop, rightLineDiffsMap);
    }

    function refreshDiff() {
      performDiff();
      syncInnerScroll(leftText, leftLineNumbers, leftBackdrop, leftHighlightLayer);
      syncInnerScroll(rightText, rightLineNumbers, rightBackdrop, rightHighlightLayer);
    }

    function clearAll() {
      leftText.value = '';
      rightText.value = '';
      refreshDiff();
    }

    document.getElementById('compareBtn').addEventListener('click', refreshDiff);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    let inputTimer;
    [leftText, rightText].forEach(textarea => {
      textarea.addEventListener('input', () => {
        clearTimeout(inputTimer);
        inputTimer = setTimeout(refreshDiff, 300);
        updateLineNumbers(textarea, textarea === leftText ? leftLineNumbers : rightLineNumbers);
        const backdrop = textarea === leftText ? leftBackdrop : rightBackdrop;
        backdrop.innerHTML = textarea.value.split('\n').map(l => `<div>${escapeHtml(l) || ' '}</div>`).join('');
      });
    });

    clearAll();
  })();
</script>
</body>
</html>
