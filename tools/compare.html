<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>智能文本差异对比工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f7fb;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
    }

    .app {
      max-width: 1500px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      padding: 1.8rem 1.8rem 2rem;
      transition: all 0.2s;
      position: relative;
    }

    /* 右上角主页链接 - 精致小巧 */
    .home-link {
      position: absolute;
      top: 1.8rem;
      right: 2rem;
      background: #f1f5f9;
      color: #1e293b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.3rem 1rem 0.3rem 0.9rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid #e2e8f0;
      transition: 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      letter-spacing: 0.01em;
    }

    .home-link:hover {
      background: #e9edf4;
      border-color: #cbd5e1;
      transform: scale(1.02);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .home-link svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #1e293b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-top: -1px;
    }

    h1 {
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.3px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e9edf4;
      padding-right: 120px; /* 给右上角链接留空间 */
    }

    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #64748b;
      margin-left: 0.6rem;
      background: #f1f4f9;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .btn {
      background: white;
      border: 1px solid #d0d8e5;
      color: #1e293b;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .btn-primary {
      background: #1e293b;
      border-color: #1e293b;
      color: white;
    }

    .btn-primary:hover {
      background: #0f172a;
      border-color: #0f172a;
    }

    .btn-outline {
      background: transparent;
      border-color: #d0d8e5;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #b0c0d4;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .info-badge {
      font-size: 0.8rem;
      background: #f1f5f9;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-top: 0.2rem;
    }

    .col {
      background: #ffffff;
      border-radius: 1.2rem;
      border: 1px solid #eef2f8;
      box-shadow: 0 4px 8px rgba(0,0,0,0.01);
      transition: border 0.15s;
      display: flex;
      flex-direction: column;
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1.2rem;
      background: #fafcff;
      border-bottom: 1px solid #eef2f8;
      border-radius: 1.2rem 1.2rem 0 0;
      font-weight: 500;
      color: #1e293b;
      font-size: 0.9rem;
    }

    .col-header .count {
      background: #e9edf4;
      padding: 0.1rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #475569;
    }

    .text-area-wrap {
      padding: 0.8rem 0.8rem 0.8rem 0.8rem;
      flex: 1;
      min-height: 400px;
      position: relative;
    }

    .line-numbered-area {
      display: flex;
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: #fcfdff;
      border-radius: 0.6rem;
      border: 1px solid #eef2f8;
      overflow: hidden;
      position: relative;
    }

    .line-numbers {
      background: #f8fafc;
      color: #94a3b8;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      padding: 0.8rem 0.4rem 0.8rem 0.8rem;
      text-align: right;
      user-select: none;
      min-width: 2.8rem;
      white-space: pre-wrap;
      word-break: keep-all;
      border-right: 1px solid #e9edf4;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      z-index: 2;
      background: #fafcff;
      letter-spacing: 0.02em;
    }

    .line-numbers span {
      display: block;
      padding: 0 0.2rem;
    }

    .text-area-wrapper {
      flex: 1;
      position: relative;
      background: transparent;
      min-height: 400px;
    }

    .text-area {
      width: 100%;
      height: 100%;
      min-height: 400px;
      padding: 0.8rem 0.8rem 0.8rem 0.6rem;
      border: none;
      outline: none;
      resize: vertical;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      background: transparent;
      color: #0b1a2b;
      letter-spacing: 0.01em;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      z-index: 3;
      caret-color: #1e293b;
    }

    .text-area:focus {
      background: rgba(255, 255, 255, 0.5);
    }

    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      border-radius: 0.4rem;
    }

    .diff-line-marker {
      position: absolute;
      left: 0;
      right: 0;
      background: rgba(255, 215, 0, 0.3);
      border-left: 4px solid #e6a100;
      border-radius: 0 6px 6px 0;
      pointer-events: none;
      z-index: 1;
      transition: background 0.1s;
    }

    .text-area::-webkit-scrollbar,
    .line-numbers::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .text-area::-webkit-scrollbar-track,
    .line-numbers::-webkit-scrollbar-track {
      background: #f1f4f9;
      border-radius: 6px;
    }

    .text-area::-webkit-scrollbar-thumb,
    .line-numbers::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .text-area::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }

    @media (max-width: 760px) {
      .compare-grid {
        grid-template-columns: 1fr;
        gap: 1.8rem;
      }

      .app {
        padding: 1.2rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .actions {
        justify-content: center;
      }

      .home-link {
        position: relative;
        top: auto;
        right: auto;
        align-self: flex-end;
        margin-bottom: 0.5rem;
        padding: 0.2rem 0.9rem;
        font-size: 0.8rem;
      }

      h1 {
        padding-right: 0;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
    }

    @media (max-width: 480px) {
      .btn {
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
      }

      h1 {
        font-size: 1.4rem;
      }
    }

    .text-muted {
      color: #64748b;
      font-weight: 400;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- 右上角“回到主页”链接 -->
  <a href="https://zetalin.top/" class="home-link" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" width="16" height="16">
      <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
    </svg>
    回到主页
  </a>

  <h1>
    📄 智能文本差异对比工具
    <small>简单 · 直观 · 高效</small>
  </h1>

  <div class="toolbar">
    <div class="actions">
      <button class="btn btn-primary" id="compareBtn">🔍 智能对比</button>
      <button class="btn btn-outline" id="clearBtn">🗑️ 清空</button>
      <button class="btn btn-outline" id="resetBtn">↺ 重置示例</button>
    </div>
    <div class="info-badge">
      <span>⚡ 不同行 </span>
      <span id="diffCount" style="font-weight:600; min-width:2rem;">0</span>
    </div>
  </div>

  <div class="compare-grid">
    <div class="col" id="leftCol">
      <div class="col-header">
        <span>📝 左侧文本</span>
        <span class="count" id="leftCount">0 行</span>
      </div>
      <div class="text-area-wrap" id="leftWrap">
        <div class="line-numbered-area" id="leftNumberedArea">
          <div class="line-numbers" id="leftLineNumbers"></div>
          <div class="text-area-wrapper">
            <div class="highlight-layer" id="leftHighlightLayer"></div>
            <textarea class="text-area" id="leftText" placeholder="粘贴或输入左侧文本…" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="col" id="rightCol">
      <div class="col-header">
        <span>📝 右侧文本</span>
        <span class="count" id="rightCount">0 行</span>
      </div>
      <div class="text-area-wrap" id="rightWrap">
        <div class="line-numbered-area" id="rightNumberedArea">
          <div class="line-numbers" id="rightLineNumbers"></div>
          <div class="text-area-wrapper">
            <div class="highlight-layer" id="rightHighlightLayer"></div>
            <textarea class="text-area" id="rightText" placeholder="粘贴或输入右侧文本…" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const leftText = document.getElementById('leftText');
    const rightText = document.getElementById('rightText');
    const leftLineNumbers = document.getElementById('leftLineNumbers');
    const rightLineNumbers = document.getElementById('rightLineNumbers');
    const leftHighlightLayer = document.getElementById('leftHighlightLayer');
    const rightHighlightLayer = document.getElementById('rightHighlightLayer');
    const diffCountSpan = document.getElementById('diffCount');
    const leftCountSpan = document.getElementById('leftCount');
    const rightCountSpan = document.getElementById('rightCount');

    const compareBtn = document.getElementById('compareBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 示例文本（点击"重置示例"时使用）
    const sampleLeft = `智能对比工具
  支持行级差异检测
  左侧文本区域
  第三行有差异
  第五行相同内容
  第六行左侧独有
  第七行一致`;

    const sampleRight = `智能对比工具
  支持行级差异检测
  右侧文本区域
  第三行有差异
  第五行相同内容
  第六行右侧新增
  第七行一致`;

    function updateLineNumbers(textarea, lineNumbersDiv) {
      const lines = textarea.value.split('\n');
      const lineCount = lines.length;
      let html = '';
      for (let i = 1; i <= lineCount; i++) {
        html += `<span>${i}</span>`;
      }
      if (lineCount === 0) {
        html = '<span>1</span>';
      }
      lineNumbersDiv.innerHTML = html;
    }

    function updateCounts() {
      const leftLines = leftText.value.split('\n');
      const rightLines = rightText.value.split('\n');
      leftCountSpan.textContent = `${leftLines.length} 行`;
      rightCountSpan.textContent = `${rightLines.length} 行`;
    }

    function clearHighlights() {
      leftHighlightLayer.innerHTML = '';
      rightHighlightLayer.innerHTML = '';
    }

    function syncScroll(textarea, lineNumbersDiv) {
      if (lineNumbersDiv) {
        lineNumbersDiv.scrollTop = textarea.scrollTop;
      }
    }

    function addHighlight(layer, lineIndex, lineHeight, paddingTop) {
      const marker = document.createElement('div');
      marker.className = 'diff-line-marker';
      marker.style.position = 'absolute';
      marker.style.left = '0px';
      marker.style.right = '0px';
      marker.style.top = `${lineIndex * lineHeight + paddingTop}px`;
      marker.style.height = `${lineHeight}px`;
      marker.style.backgroundColor = 'rgba(255, 215, 0, 0.3)';
      marker.style.borderLeft = '4px solid #e6a100';
      marker.style.borderRadius = '0 6px 6px 0';
      marker.style.pointerEvents = 'none';
      marker.style.zIndex = '1';
      layer.appendChild(marker);
    }

    function performDiff() {
      const leftLines = leftText.value.split('\n');
      const rightLines = rightText.value.split('\n');

      clearHighlights();
      updateCounts();
      updateLineNumbers(leftText, leftLineNumbers);
      updateLineNumbers(rightText, rightLineNumbers);

      if (leftLines.length === 0 && rightLines.length === 0) {
        diffCountSpan.textContent = '0';
        return;
      }

      const leftStyle = window.getComputedStyle(leftText);
      const rightStyle = window.getComputedStyle(rightText);

      const leftLineHeight = parseFloat(leftStyle.lineHeight) || parseFloat(leftStyle.fontSize) * 1.6;
      const rightLineHeight = parseFloat(rightStyle.lineHeight) || parseFloat(rightStyle.fontSize) * 1.6;

      const leftPaddingTop = parseFloat(leftStyle.paddingTop) || 0;
      const rightPaddingTop = parseFloat(rightStyle.paddingTop) || 0;

      const maxLen = Math.max(leftLines.length, rightLines.length);
      let diffCount = 0;

      for (let i = 0; i < maxLen; i++) {
        const leftLine = i < leftLines.length ? leftLines[i] : '';
        const rightLine = i < rightLines.length ? rightLines[i] : '';

        if (leftLine !== rightLine) {
          diffCount++;
          if (i < leftLines.length) {
            addHighlight(leftHighlightLayer, i, leftLineHeight, leftPaddingTop);
          }
          if (i < rightLines.length) {
            addHighlight(rightHighlightLayer, i, rightLineHeight, rightPaddingTop);
          }
        }
      }

      diffCountSpan.textContent = diffCount;
    }

    function refreshDiff() {
      performDiff();
      syncScroll(leftText, leftLineNumbers);
      syncScroll(rightText, rightLineNumbers);
    }

    function clearAll() {
      leftText.value = '';
      rightText.value = '';
      clearHighlights();
      updateCounts();
      updateLineNumbers(leftText, leftLineNumbers);
      updateLineNumbers(rightText, rightLineNumbers);
      diffCountSpan.textContent = '0';
    }

    function loadSample() {
      leftText.value = sampleLeft;
      rightText.value = sampleRight;
      refreshDiff();
    }

    compareBtn.addEventListener('click', refreshDiff);

    clearBtn.addEventListener('click', function() {
      clearAll();
    });

    resetBtn.addEventListener('click', function() {
      loadSample();
    });

    let inputTimer;
    function autoDiff() {
      clearTimeout(inputTimer);
      inputTimer = setTimeout(function() {
        refreshDiff();
      }, 300);
    }

    leftText.addEventListener('input', function() {
      autoDiff();
      updateLineNumbers(leftText, leftLineNumbers);
      syncScroll(leftText, leftLineNumbers);
    });

    rightText.addEventListener('input', function() {
      autoDiff();
      updateLineNumbers(rightText, rightLineNumbers);
      syncScroll(rightText, rightLineNumbers);
    });

    leftText.addEventListener('scroll', function() {
      syncScroll(leftText, leftLineNumbers);
    });

    rightText.addEventListener('scroll', function() {
      syncScroll(rightText, rightLineNumbers);
    });

    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        refreshDiff();
      }, 200);
    });

    // 初始化：不加载示例，留空
    clearAll();

    console.log('✅ 文本对比工具已启动 · 统一高亮 + 行号');
  })();
</script>
</body>
</html>
